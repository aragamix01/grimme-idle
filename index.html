<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grimm Idle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="game"><button type="button" id="map-menu" class="zoom-btn menu-btn" aria-expanded="false" aria-label="ปุ่มแผนที่"><span class="menu-btn__bars"></span></button><button type="button" id="worldmap" class="zoom-btn map-btn" aria-pressed="false" aria-label="แผนที่โลก"><img src="/assets/sprites/icons/globe.png" alt="" width="16" height="16" /></button><button type="button" id="daynight" class="zoom-btn daynight-btn" aria-pressed="true" aria-label="กลางวันกลางคืน"><img src="/assets/sprites/icons/daynight.png" alt="" width="16" height="16" /></button><button type="button" id="sound" class="zoom-btn sound-btn" aria-pressed="true" aria-label="เสียงเพลง"><img src="/assets/sprites/icons/sound.png" alt="" width="16" height="16" /></button><button type="button" id="zoom" class="zoom-btn" aria-pressed="false" aria-label="ซูมแผนที่"><img src="/assets/sprites/icons/zoom.png" alt="" width="16" height="16" /></button></div>
      <aside id="side">
        <header class="side-head">
          <img id="logo" src="/assets/sprites/logo/logo.png" alt="Grimm Idle" />
          <dl class="stats">
            <div class="stat"><dt>ปีที่</dt><dd id="stat-year">1</dd></div>
            <div class="stat"><dt>วันที่</dt><dd id="stat-day">1</dd></div>
            <div class="stat stat--faith">
              <dt><img src="/assets/sprites/icons/faith.png" alt="" width="16" height="16" />ศรัทธา</dt>
              <dd id="stat-faith">0</dd>
            </div>
          </dl>
          <div class="seg" role="group" aria-label="ความเร็วของเวลา" id="speed">
            <button type="button" data-speed="0">หยุด</button>
            <button type="button" data-speed="1" aria-pressed="true">1×</button>
            <button type="button" data-speed="3">3×</button>
          </div>
          <div class="head-actions">
            <button type="button" id="miracle-open" class="era-open"><img src="/assets/sprites/icons/bless.png" alt="" width="16" height="16" />บันดาล</button>
            <button type="button" id="era-open" class="era-open">ยุคที่ 1</button>
            <button type="button" id="life-open" class="era-open">ลงไปเกิด</button>
          </div>
        </header>

        <section id="npc-card" class="npc" hidden aria-live="polite"></section>
        <p id="npc-hint" class="hint">คลิกชาวเมืองบนแผนที่เพื่อดูชีวิตและใช้พลังเทพ</p>

        <section class="log" aria-labelledby="log-title">
          <h2 id="log-title" class="visually-hidden">พงศาวดาร กิลด์ ตลาด อาณาจักร และประชาชน</h2>
          <div class="seg tabs" role="tablist" aria-label="มุมมอง" id="side-tabs">
            <button type="button" role="tab" data-tab="log" aria-selected="true" aria-pressed="true">พงศาวดาร</button>
            <button type="button" role="tab" data-tab="guild" aria-selected="false" aria-pressed="false">กิลด์</button>
            <button type="button" role="tab" data-tab="market" aria-selected="false" aria-pressed="false">ตลาด</button>
            <button type="button" role="tab" data-tab="kingdom" aria-selected="false" aria-pressed="false">อาณาจักร</button>
            <button type="button" role="tab" data-tab="people" aria-selected="false" aria-pressed="false">ประชาชน</button>
          </div>
          <div class="log-head" id="log-tools">
            <span class="log-note">เรื่องเล่าล่าสุดของโลก</span>
            <div class="seg seg--small" role="group" aria-label="กรองพงศาวดาร" id="log-filter">
              <button type="button" data-filter="all" aria-pressed="true">ทั้งหมด</button>
              <button type="button" data-filter="years" aria-pressed="false">รายปี</button>
              <button type="button" data-filter="npc" disabled>คนนี้</button>
            </div>
          </div>
          <ol id="feed" role="tabpanel"></ol>
          <div id="annals" class="annals" hidden></div>
          <div id="guild" class="guild" role="tabpanel" hidden></div>
          <div id="market" class="guild market" role="tabpanel" hidden></div>
          <div id="kingdom" class="guild kingdom" role="tabpanel" hidden></div>
          <div id="people" class="guild people" role="tabpanel" hidden></div>
          <div class="seg tabs" role="tablist" aria-label="แผนที่โลก" id="map-tabs" hidden>
            <button type="button" role="tab" data-maptab="realms" aria-selected="true" aria-pressed="true">อาณาจักร</button>
            <button type="button" role="tab" data-maptab="lands" aria-selected="false" aria-pressed="false">ดินแดน</button>
          </div>
          <div id="realms" class="guild realms" hidden></div>
          <div id="lands" class="guild realms" hidden></div>
        </section>
      </aside>
    </div>

    <div id="bubbles" aria-hidden="true"></div>
    <div id="catchup" class="catchup" role="status" hidden></div>

    <dialog id="offline">
      <h2>ระหว่างที่คุณไม่อยู่</h2>
      <p id="offline-days" class="offline-days"></p>
      <ul id="offline-counts" class="offline-counts"></ul>
      <section id="offline-legends-sec" hidden>
        <h3 class="offline-sub">ตำนานที่เกิดขึ้น</h3>
        <ol id="offline-legends" class="offline-list"></ol>
      </section>
      <h3 class="offline-sub">เหตุการณ์ล่าสุด</h3>
      <ol id="offline-highlights" class="offline-list"></ol>
      <form method="dialog"><button class="btn btn--gold">กลับสู่โลก</button></form>
    </dialog>

    <dialog id="miracles">
      <h2>บันดาล</h2>
      <div id="miracles-body"></div>
      <form method="dialog"><button class="btn">ปิด</button></form>
    </dialog>

    <dialog id="choice" class="choice">
      <h2>ทางแยกของชีวิต</h2>
      <p id="choice-text"></p>
      <div id="choice-options" class="choice__options"></div>
    </dialog>

    <dialog id="eras">
      <h2>ยุคสมัย</h2>
      <div id="eras-body"></div>
      <form method="dialog"><button class="btn">ปิด</button></form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
