<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grimm Idle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app" data-section="town">
      <header id="hud" class="hud">
        <img id="logo" src="/assets/sprites/logo/logo.png" alt="Grimm Idle" />
        <dl class="stats">
          <div class="stat"><dt>ปีที่</dt><dd id="stat-year">1</dd></div>
          <div class="stat"><dt>วันที่</dt><dd id="stat-day">1</dd></div>
          <div class="stat stat--faith">
            <dt><img src="/assets/sprites/icons/faith.png" alt="" width="16" height="16" /><span class="stat__label">ศรัทธา</span></dt>
            <dd id="stat-faith">0</dd>
          </div>
        </dl>
        <div class="seg speed" role="group" aria-label="ความเร็วของเวลา" id="speed">
          <button type="button" data-speed="0" aria-label="หยุดเวลา">II</button>
          <button type="button" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" data-speed="3">3×</button>
        </div>
      </header>

      <div id="game">
        <button type="button" id="map-menu" class="map-menu" aria-expanded="false" aria-controls="map-tools" aria-label="เมนูแผนที่"><span class="map-menu__bars"></span></button>
        <div id="map-tools" class="map-tools" role="menu" hidden>
          <button type="button" id="zoom" role="menuitemcheckbox" aria-pressed="false"><img src="/assets/sprites/icons/zoom.png" alt="" width="24" height="24" /><span>ซูมแผนที่</span><b class="map-tools__state"></b></button>
          <button type="button" id="daynight" role="menuitemcheckbox" aria-pressed="true"><img src="/assets/sprites/icons/daynight.png" alt="" width="24" height="24" /><span>กลางวันกลางคืน</span><b class="map-tools__state"></b></button>
          <button type="button" id="sound" role="menuitemcheckbox" aria-pressed="true"><img src="/assets/sprites/icons/sound.png" alt="" width="24" height="24" /><span>เสียงเพลง</span><b class="map-tools__state"></b></button>
        </div>
      </div>

      <aside id="side" class="sheet">
        <section id="npc-card" class="npc" hidden aria-live="polite"></section>
        <div class="sheet-head">
          <h2 id="sheet-title" class="sheet-title">เมือง</h2>
          <div class="seg tabs" role="tablist" aria-label="หัวข้อย่อย" id="sub-tabs"></div>
        </div>
        <p id="npc-hint" class="hint">แตะชาวเมืองบนแผนที่เพื่อดูชีวิตและใช้พลังเทพ</p>
        <ol id="feed" class="panel" role="tabpanel"></ol>
        <div id="annals" class="panel annals" role="tabpanel" hidden></div>
        <div id="guild" class="panel guild" role="tabpanel" hidden></div>
        <div id="market" class="panel guild market" role="tabpanel" hidden></div>
        <div id="kingdom" class="panel guild kingdom" role="tabpanel" hidden></div>
        <div id="people" class="panel guild people" role="tabpanel" hidden></div>
        <div id="realms" class="panel guild realms" role="tabpanel" hidden></div>
        <div id="lands" class="panel guild realms" role="tabpanel" hidden></div>
      </aside>

      <nav id="nav" class="nav" aria-label="หมวดหลัก">
        <button type="button" data-section="town" aria-current="page"><img src="/assets/sprites/icons/book.png" alt="" width="24" height="24" /><span>เมือง</span></button>
        <button type="button" data-section="people"><img src="/assets/sprites/icons/heart.png" alt="" width="24" height="24" /><span>ผู้คน</span></button>
        <button type="button" data-section="power"><img src="/assets/sprites/icons/crown.png" alt="" width="24" height="24" /><span>อำนาจ</span></button>
        <button type="button" data-section="economy"><img src="/assets/sprites/icons/gold.png" alt="" width="24" height="24" /><span>เศรษฐกิจ</span></button>
        <button type="button" data-section="world" id="worldmap"><img src="/assets/sprites/icons/globe.png" alt="" width="24" height="24" /><span>โลก</span></button>
        <button type="button" id="miracle-open" class="fab"><img src="/assets/sprites/icons/faith.png" alt="" width="32" height="32" /><span>พลังเทพ</span></button>
      </nav>
    </div>

    <div id="bubbles" aria-hidden="true"></div>
    <div id="catchup" class="catchup" role="status" hidden></div>

    <dialog id="offline">
      <h2>ระหว่างที่คุณไม่อยู่</h2>
      <p id="offline-days" class="offline-days"></p>
      <ul id="offline-counts" class="offline-counts"></ul>
      <section id="offline-legends-sec" hidden>
        <h3 class="offline-sub">ตำนานที่เกิดขึ้น</h3>
        <ol id="offline-legends" class="offline-list"></ol>
      </section>
      <h3 class="offline-sub">เหตุการณ์ล่าสุด</h3>
      <ol id="offline-highlights" class="offline-list"></ol>
      <form method="dialog"><button class="btn btn--gold">กลับสู่โลก</button></form>
    </dialog>

    <dialog id="miracles" class="sheet-dialog">
      <div class="powers-head">
        <h2>พลังเทพ</h2>
        <form method="dialog"><button class="dialog-x" aria-label="ปิด">×</button></form>
      </div>
      <div class="powers-top">
        <button type="button" id="life-open" class="era-open">ลงไปเกิด</button>
        <button type="button" id="era-open" class="era-open">ยุคที่ 1</button>
      </div>
      <div id="miracles-body"></div>
      <form method="dialog"><button class="btn">ปิด</button></form>
    </dialog>

    <dialog id="choice" class="choice">
      <h2>ทางแยกของชีวิต</h2>
      <p id="choice-text"></p>
      <div id="choice-options" class="choice__options"></div>
    </dialog>

    <dialog id="eras">
      <h2>ยุคสมัย</h2>
      <div id="eras-body"></div>
      <form method="dialog"><button class="btn">ปิด</button></form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
